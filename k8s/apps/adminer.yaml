apiVersion: v1
kind: ConfigMap
metadata:
  name: adminer-autologin
data:
  autologin.php: |
    <?php
    $_GET["pgsql"] = getenv("PG_HOST") ?: "postgres";
    $_GET["username"] = getenv("POSTGRES_USER") ?: "postgres";
    $_GET["db"] = getenv("POSTGRES_DB") ?: "fabrica";
    
    class AdminerAutoLogin {
        function credentials() {
            return array(getenv("PG_HOST") ?: "postgres", getenv("POSTGRES_USER") ?: "postgres", getenv("POSTGRES_PASSWORD") ?: "postgres");
        }
        function database() {
            return getenv("POSTGRES_DB") ?: "fabrica";
        }
        function login($login, $password) {
            return true;
        }
    }
    return new AdminerAutoLogin();
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: adminer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
      - name: adminer
        image: adminer:latest
        envFrom:
        - configMapRef:
            name: postgres-config
        env:
        - name: PG_HOST
          value: "postgres"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: autologin-script
          mountPath: /var/www/html/plugins-enabled/autologin.php
          subPath: autologin.php
      volumes:
      - name: autologin-script
        configMap:
          name: adminer-autologin
