apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
      - name: consumer
        image: smart-factory-consumer:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: consumer-config
