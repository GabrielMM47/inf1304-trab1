apiVersion: v1
kind: ServiceAccount
metadata:
  name: controlador-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controlador-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controlador-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: controlador-sa
  namespace: default
roleRef:
  kind: Role
  name: controlador-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlador
spec:
  replicas: 2
  selector:
    matchLabels:
      app: controlador
  template:
    metadata:
      labels:
        app: controlador
    spec:
      serviceAccountName: controlador-sa
      containers:
      - name: controlador
        image: smart-factory-controlador:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: controlador-config
        env:
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
