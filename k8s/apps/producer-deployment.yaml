          value: "0.5" # Produz 2x mais rápido
        - name: MULTIPLICADOR_TEMPERATURA
          value: "1.0" # Temperatura no mesmo intervalo base (a cada 0,5 s)
        - name: MULTIPLICADOR_VIBRACAO
          value: "3.5" # Vibração enviada com menos frequência (a cada 1,75 s)

