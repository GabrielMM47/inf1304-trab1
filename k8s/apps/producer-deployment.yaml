apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-maquina-1
  labels:
    app: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
      sensor-id: maquina-1
  template:
    metadata:
      labels:
        app: producer
        sensor-id: maquina-1
    spec:
      initContainers:
      - name: wait-for-kafka
        image: confluentinc/cp-kafka:latest
        command:
        - /bin/bash
        - -c
        - |
          echo "Waiting for Kafka topic 'dados-sensores' to be created..."
          while ! kafka-topics --bootstrap-server kafka:9092 --list 2>/dev/null | grep -q "dados-sensores"; do
            sleep 2
            echo "Waiting..."
          done
          echo "Kafka is ready and topics are created!"
      containers:
      - name: producer
        image: smart-factory-producer:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: producer-config
        env:
        - name: MAQUINA_ID
          value: "maquina-1"
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: GENERATION_INTERVAL
          value: "1.0" # Comportamento padrão
