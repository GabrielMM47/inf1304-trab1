apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
spec:
  template:
    spec:
      containers:
      - name: init-topics
        image: bitnami/kafka:3.4.0
        command:
        - /bin/bash
        - -c
        - |
          echo "Waiting for Kafka to be ready..."
          sleep 15
          kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic dados-sensores --partitions 3 --replication-factor 1
          kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic comandos-fabrica --partitions 3 --replication-factor 1
      restartPolicy: OnFailure
